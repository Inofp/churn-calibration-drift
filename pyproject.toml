[project]
name = "churn-calibration-drift"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "joblib>=1.3",
  "pydantic>=2.6",
  "catboost>=1.2",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "scripts"]
fix = true

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["churnml"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
